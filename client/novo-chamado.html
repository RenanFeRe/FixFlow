<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Abrir Chamado — FixFlow</title>
        <link rel="stylesheet" href="../css/reset.css" />
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle" />

        <div class="mobile-header">
            <div class="mobile-header-brand">
                <span>FixFlow</span>
            </div>
            <label for="sidebar-toggle" class="mobile-header-toggle">☰</label>
        </div>

        <label for="sidebar-toggle" class="sidebar-overlay"></label>

        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="sidebar-brand-icon">F</div>
                <span class="sidebar-brand-text">FixFlow</span>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html">
                    <span class="nav-icon"
                        ><svg
                            viewBox="0 0 24 24"
                            width="20"
                            height="20"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <rect x="3" y="3" width="7" height="7" />
                            <rect x="14" y="3" width="7" height="7" />
                            <rect x="3" y="14" width="7" height="7" />
                            <rect x="14" y="14" width="7" height="7" /></svg
                    ></span>
                    Dashboard
                </a>
                <a href="novo-chamado.html" class="active">
                    <span class="nav-icon"
                        ><svg
                            viewBox="0 0 24 24"
                            width="20"
                            height="20"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="12" cy="12" r="10" />
                            <line x1="12" y1="8" x2="12" y2="16" />
                            <line x1="8" y1="12" x2="16" y2="12" /></svg
                    ></span>
                    Abrir Chamado
                </a>
                <a href="reviews.html">
                    <span class="nav-icon"
                        ><svg
                            viewBox="0 0 24 24"
                            width="20"
                            height="20"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <polygon
                                points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
                            /></svg
                    ></span>
                    Minhas Avaliações
                </a>
                <a href="profile.html">
                    <span class="nav-icon"
                        ><svg
                            viewBox="0 0 24 24"
                            width="20"
                            height="20"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="12" cy="12" r="3" />
                            <path
                                d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
                            /></svg
                    ></span>
                    Configurar Perfil
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="../login.html">
                    <span class="nav-icon"
                        ><svg
                            viewBox="0 0 24 24"
                            width="20"
                            height="20"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                            <polyline points="16 17 21 12 16 7" />
                            <line x1="21" y1="12" x2="9" y2="12" /></svg
                    ></span>
                    Sair
                </a>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Abrir Chamado</h1>
                <p>Registre um novo chamado técnico.</p>
            </div>

            <div class="profile-section">
                <div class="profile-form-card">
                    <form>
                        <div class="form-group">
                            <label class="form-label" for="titulo"
                                >Título</label
                            >
                            <input
                                class="form-input"
                                type="text"
                                id="titulo"
                                placeholder="Ex: Computador não liga"
                                required
                            />
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="resumo"
                                >Resumo do Problema</label
                            >
                            <textarea
                                class="form-input"
                                id="resumo"
                                placeholder="Descreva detalhadamente o problema que está ocorrendo..."
                                required
                            ></textarea>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="prioridade"
                                >Prioridade</label
                            >
                            <select class="form-input" id="prioridade" required>
                                <option value="critical">Crítica</option>
                                <option value="high">Alta</option>
                                <option value="medium">Média</option>
                                <option value="low">Baixa</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="nome"
                                >Seu Nome</label
                            >
                            <input
                                class="form-input"
                                type="text"
                                id="nome"
                                placeholder="Seu nome completo"
                                required
                            />
                        </div>

                        <button
                            class="btn btn-primary btn-full btn-lg"
                            type="submit"
                        >
                            Abrir Chamado
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </body>
</html>
