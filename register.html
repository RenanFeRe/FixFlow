<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro — FixFlow</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-card">
            <div class="auth-card-header">
                <div class="auth-logo">F</div>
                <h1>Criar Conta</h1>
                <p>Preencha os dados para se cadastrar</p>
            </div>

            <form>
                <div class="form-group">
                    <label class="form-label" for="name">Nome</label>
                    <input class="form-input" type="text" id="name" placeholder="Seu nome completo" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-input" type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Senha</label>
                    <input class="form-input" type="password" id="password" placeholder="Crie uma senha" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password-confirm">Confirmar Senha</label>
                    <input class="form-input" type="password" id="password-confirm" placeholder="Repita a senha"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label">Tipo de Conta</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="role" value="cliente" checked>
                            <span class="radio-option-content">
                                <span class="radio-option-icon">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                        <circle cx="12" cy="7" r="4"/>
                                    </svg>
                                </span>
                                <span class="radio-option-label">Cliente</span>
                                <span class="radio-option-desc">Solicitar reparos</span>
                            </span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="role" value="tecnico">
                            <span class="radio-option-content">
                                <span class="radio-option-icon">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                                    </svg>
                                </span>
                                <span class="radio-option-label">Técnico</span>
                                <span class="radio-option-desc">Atender chamados</span>
                            </span>
                        </label>
                    </div>
                </div>

                <button id="cadastrar-btn" class="btn btn-primary btn-full btn-lg" type="submit">Cadastrar</button>
            </form>

            <div>


            </div>
            <p class="auth-footer-text">
                Já tem uma conta? <a href="login.html">Entrar</a>
            </p>
        </div>
    </div>

    <script src="scripts/cadastro.js"></script>
</body>

</html>
