<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — FixFlow</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-logo">F</div>
        <h1>Entrar</h1>
        <p>Acesse sua conta FixFlow</p>
      </div>

      <form>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Senha</label>
          <input class="form-input" type="password" id="password" placeholder="Sua senha" required>
        </div>

        <button class="btn btn-primary btn-full btn-lg" type="submit">Entrar</button>
      </form>

      <p class="auth-footer-text">
        Não tem uma conta? <a href="register.html">Cadastre-se</a>
      </p>
    </div>
  </div>
</body>
</html>
